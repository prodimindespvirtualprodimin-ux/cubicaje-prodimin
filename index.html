<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cubicaje Prodimin — siluetas y catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2ecdc;--panel:#f8f4e8;--panel-2:#ece4d2;--border:#d9d2c2;--border-strong:#bfb49c;
  --text:#0e2a22;--text-2:#42564d;--text-3:#56665e;
  --accent:#8f4307;--accent-2:#f59e0b;--accent-dim:rgba(143,67,7,.12);
  --steel:#e7ddc8;--line:#7a6a4f;--sage:#7b8a82;--tire:#4c4438;--hub:#a59a84;
  --cab:#dfe7e2;--glass:#b9cdc6;--wood:#a1622d;--wood-d:#7a4a1d;--lamp:#f59e0b;--lamp-r:#c2410c;
  --radius:8px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1914;--panel:#25211a;--panel-2:#2e2920;--border:#3b3429;--border-strong:#564c3c;
    --text:#efe6d2;--text-2:#cbbfa6;--text-3:#a39880;--accent:#f0a33a;--accent-dim:rgba(240,163,58,.14);
    --steel:#3a3428;--line:#c5b48f;--sage:#9fb0a7;--tire:#111;--hub:#6d6454;--cab:#2f3a35;--glass:#4f6a62;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1914;--panel:#25211a;--panel-2:#2e2920;--border:#3b3429;--border-strong:#564c3c;
  --text:#efe6d2;--text-2:#cbbfa6;--text-3:#a39880;--accent:#f0a33a;--accent-dim:rgba(240,163,58,.14);
  --steel:#3a3428;--line:#c5b48f;--sage:#9fb0a7;--tire:#111;--hub:#6d6454;--cab:#2f3a35;--glass:#4f6a62;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.6 var(--sans);color:var(--text);background:var(--bg);min-height:100%;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:var(--mono);color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.topbar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid var(--border);background:var(--panel)}
.topbar h1{font:700 19px/1.2 var(--mono);letter-spacing:.06em;color:var(--text)}
.topbar p{font:400 12px/1.4 var(--mono);color:var(--text-3)}

.layout{display:grid;grid-template-columns:1fr;gap:1px;background:var(--border)}
@media (min-width:1000px){.layout{grid-template-columns:290px minmax(0,1fr)}}
.col{background:var(--bg);padding:18px;min-width:0}
.col h2{font:700 11px/1 var(--mono);letter-spacing:.16em;color:var(--text-2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.col h2::after{content:"";flex:1;height:1px;background:var(--border)}
.group{font:600 11px/1.3 var(--sans);color:var(--text-3);margin:14px 0 6px}
.group:first-of-type{margin-top:0}

.units{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:560px) and (max-width:999px){.units{grid-template-columns:1fr 1fr}}
.unit{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text-2);font:600 12.5px/1.35 var(--mono);transition:border-color .15s,color .15s,background .15s}
.unit:hover{border-color:var(--border-strong);color:var(--text)}
.unit[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.unit small{display:block;font:400 10.5px/1.4 var(--mono);color:var(--text-3)}

.vizhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tab{background:var(--panel);border:none;color:var(--text-2);font:500 12px/1 var(--mono);padding:9px 15px;transition:background .15s,color .15s}
.tab+.tab{border-left:1px solid var(--border)}
.tab[aria-selected="true"]{background:var(--accent-dim);color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;margin-left:auto;font:500 12px/1 var(--mono);color:var(--text-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

.spec{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
.spec .title{width:100%;font:700 17px/1.25 var(--sans);color:var(--text)}
.spec .title span{font:400 13px/1 var(--sans);color:var(--text-3);margin-left:6px}
.kv{font:400 11px/1.3 var(--mono);color:var(--text-3)}
.kv b{display:block;font:700 14px/1.3 var(--mono);color:var(--text)}

.stage{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:8px;overflow:hidden;
  background-image:linear-gradient(var(--panel-2) 1px,transparent 1px),linear-gradient(90deg,var(--panel-2) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.stage svg{display:block;width:100%;height:auto;max-height:470px}
.stage canvas{display:block;width:100%;border-radius:6px}
.msg{padding:48px 20px;text-align:center;color:var(--text-3);font:400 12.5px/1.8 var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font:400 11.5px/1.4 var(--mono);color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--sage);border-radius:0}
.hint{font:400 11px/1.5 var(--mono);color:var(--text-3);margin-top:8px}

.fleet{margin-top:26px;max-width:760px}
.fleet .row{display:block;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--border);padding:10px 4px 6px;transition:background .15s}
.fleet .row:hover{background:var(--panel)}
.fleet .row[aria-pressed="true"] .nm{color:var(--accent)}
.fleet .nm{font:600 12px/1.3 var(--mono);color:var(--text)}
.fleet .nm small{font-weight:400;color:var(--text-3);margin-left:8px}
.fleet svg{display:block;height:auto;margin-top:4px}
.scalebar{font:400 11px/1.4 var(--mono);color:var(--text-3);margin:6px 0 2px;display:flex;align-items:center;gap:8px}
.scalebar i{display:inline-block;height:6px;border:1.5px solid var(--text-3);border-top:none}

/* dibujo SVG */
.drw *{vector-effect:non-scaling-stroke}
.drw .ln{fill:none;stroke:var(--line);stroke-width:1.3}
.drw .stl{fill:var(--steel);stroke:var(--line);stroke-width:1.3}
.drw .stl-t{fill:var(--steel);fill-opacity:.45;stroke:var(--line);stroke-width:1.2}
.drw .rib{stroke:var(--line);stroke-width:.8;opacity:.55}
.drw .cab{fill:var(--cab);stroke:var(--line);stroke-width:1.3}
.drw .glass{fill:var(--glass);stroke:var(--line);stroke-width:1}
.drw .tire{fill:var(--tire)}
.drw .hub{fill:var(--hub)}
.drw .gnd{stroke:var(--border-strong);stroke-width:1.5}
.drw .env{fill:none;stroke:var(--sage);stroke-width:1.4;stroke-dasharray:16 11}
.drw .ghost{fill:var(--steel);fill-opacity:.35;stroke:var(--line);stroke-opacity:.5;stroke-width:1}
.drw .lamp{fill:var(--lamp)}
.drw .lampr{fill:var(--lamp-r)}
.drw .wood{fill:var(--wood);stroke:var(--wood-d);stroke-width:.8}
.drw .woodd{fill:var(--wood-d)}
.drw .cota{stroke:var(--text-3);stroke-width:1;fill:none}
.drw text{font-family:var(--mono);fill:var(--text-2)}
.drw text.lbl{fill:var(--text-3)}
@media (min-width:1000px){.layout{grid-template-columns:250px minmax(0,1fr)}}
@media (min-width:1280px){.layout{grid-template-columns:240px minmax(0,1fr) 380px}}
@media (min-width:1000px) and (max-width:1279px){.cargo{grid-column:1/-1}}
.field label{display:block;font:500 10.5px/1 var(--mono);color:var(--text-3);margin-bottom:5px}
.field input,.field select,.search{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);font:500 13px/1.2 var(--mono);padding:8px 9px}
.field input:focus,.search:focus,.field select:focus{border-color:var(--accent);outline:none}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.searchrow{display:grid;grid-template-columns:1fr;gap:8px}
.meta{font:400 11px/1.4 var(--mono);color:var(--text-3);margin:8px 0 6px}
.results{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
.res{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--border);background:transparent;padding:8px 10px;font:600 12px/1.35 var(--mono);color:var(--text)}
.res:last-child{border-bottom:none}
.res:hover,.res[aria-pressed="true"]{background:var(--accent-dim);color:var(--accent)}
.res small{display:block;font:400 10.5px/1.4 var(--mono);color:var(--text-3)}
.editor{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:12px}
.editor .nm{font:700 13px/1.35 var(--mono);color:var(--text)}
.editor .info{font:400 11px/1.5 var(--mono);color:var(--text-3);margin-top:4px}
.est{color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font:500 12px/1.2 var(--mono);color:var(--text-2)}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--radius);font:600 12px/1 var(--mono);padding:10px 14px;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--text);transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:#241a03;width:100%;margin-top:12px}
.btn.primary:hover{filter:brightness(1.06);color:#241a03}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details.rules{margin-top:10px;font:400 11px/1.5 var(--mono);color:var(--text-2)}
details.rules summary{cursor:pointer;color:var(--accent);font-weight:600}
.rule{border-top:1px solid var(--border);padding:6px 0}
.rule b{color:var(--text)}
.lines{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.line{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);padding:7px 9px}
.line .sw{width:11px;height:11px;border-radius:2px}
.line .nm{font:600 11.5px/1.3 var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis}
.line .ds{font:400 10.5px/1.35 var(--mono);color:var(--text-3)}
.qty{display:flex;align-items:center;gap:5px;font:600 12px/1 var(--mono)}
.qty button,.del{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:13px;line-height:1}
.qty button:hover{border-color:var(--accent);color:var(--accent)}
.del{border:none;color:var(--text-3)}
.del:hover{color:#b91c1c}
.empty{font:400 11.5px/1.6 var(--mono);color:var(--text-3);padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius);text-align:center}
.stats{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;background:var(--panel)}
.stat .k{font:400 10.5px/1.2 var(--mono);color:var(--text-3);margin-bottom:4px}
.stat .v{font:700 15px/1.2 var(--mono);color:var(--text)}
.stat .v.warn{color:var(--accent)}
.stat .v.bad{color:#b91c1c}
.bar{height:6px;border-radius:3px;background:var(--panel-2);margin-top:6px;overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--accent)}
.unfit{margin-top:10px;font:400 11.5px/1.55 var(--mono);color:#b91c1c;border:1px solid rgba(185,28,28,.3);border-radius:var(--radius);padding:9px 11px;background:rgba(185,28,28,.06)}
.hedit{display:block;width:84px;margin-top:2px;background:var(--panel);border:1px solid var(--border-strong);border-radius:5px;color:var(--text);font:700 14px/1.2 var(--mono);padding:3px 6px}
.hedit:focus{border-color:var(--accent);outline:none}
.reset{display:block;margin-top:3px;border:none;background:none;padding:0;font:400 10.5px/1.2 var(--mono);color:var(--accent);text-decoration:underline;cursor:pointer}
.logo{height:36px;width:auto;border-radius:6px;background:#fff;padding:2px 6px;align-self:center}
.topbar{align-items:center}
.field textarea{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;color:var(--text);font:500 13px/1.4 var(--mono);padding:8px 9px;resize:vertical}
.field textarea:focus{border-color:var(--accent);outline:none}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>

/* ---------- Geometría común (m) — misma lógica que view3d.js ---------- */
function G(v){
  const Lm=v.L/100, Wm=v.W/100, Hm=v.H/100, isC=v.kind==='container';
  const deckH = isC ? 0 : Math.min(Math.max(Hm*0.55,0.85),1.3);
  const topH = deckH + Hm;
  const cfg = v.cfg || 'rigid';
  const cabL = isC ? 0 : Math.min(Math.max(Lm*0.24,1.3),2.5);
  const cabH = isC ? 0 : deckH + Math.min(Hm*0.72,1.9);
  const wr = isC ? 0 : Math.min(0.5, deckH*0.42);
  const hbH = Math.min(cfg==='semi'?1.35:1.15, Hm*0.62);
  const barH = Math.min(0.6, Hm*0.3);
  const axles = isC ? [] : (cfg==='semi'
    ? [-cabL*0.68, -cabL*0.2, Lm*0.78, Lm*0.865, Lm*0.95]
    : [-cabL*0.6, Lm*0.72]);
  return {Lm,Wm,Hm,isC,deckH,topH,cfg,cabL,cabH,wr,hbH,barH,axles};
}

const darker = hex => { const n=parseInt(hex.slice(1),16); const f=c=>Math.round(c*0.6); return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`; };

/* ---------- Ayudas SVG ---------- */
const f1 = n => (+n).toFixed(1);
function frame(xMin,xMax,yMin,yMax,targetW,targetH,fit={}){
  const S=100; let vbW, vbH, scale, fs;
  for(let i=0;i<3;i++){
    vbW=(xMax-xMin)*S; vbH=(yMax-yMin)*S;
    scale=Math.min(targetW/vbW, targetH/vbH); fs=11.5/scale;
    if (fit.b!=null) yMin=Math.min(yMin, fit.b - fs/100*1.7);
    if (fit.r!=null) xMax=Math.max(xMax, fit.r + fs/100*1.8);
  }
  vbW=(xMax-xMin)*S; vbH=(yMax-yMin)*S;
  const X=x=>f1((x-xMin)*S), Y=y=>f1((yMax-y)*S), D=d=>f1(d*S);
  const R=(x,y,w,h,cls,extra='')=>`<rect x="${X(x)}" y="${Y(y+h)}" width="${D(w)}" height="${D(h)}" class="${cls}" ${extra}/>`;
  const Ln=(x1,y1,x2,y2,cls,extra='')=>`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="${cls}" ${extra}/>`;
  const C=(x,y,r,cls,extra='')=>`<circle cx="${X(x)}" cy="${Y(y)}" r="${D(r)}" class="${cls}" ${extra}/>`;
  const T=(x,y,s,anchor='middle',cls='',rot=false)=>`<text x="${X(x)}" y="${Y(y)}" font-size="${f1(fs)}" text-anchor="${anchor}" class="${cls}"${rot?` transform="rotate(-90 ${X(x)} ${Y(y)})"`:''}>${s}</text>`;
  const cotaH=(x1,x2,y,label)=>{const t=0.08;return Ln(x1,y,x2,y,'cota')+Ln(x1,y-t,x1,y+t,'cota')+Ln(x2,y-t,x2,y+t,'cota')+T((x1+x2)/2,y-fs/100*1.25,label);};
  const cotaV=(x,y1,y2,label)=>{const t=0.08;return Ln(x,y1,x,y2,'cota')+Ln(x-t,y1,x+t,y1,'cota')+Ln(x-t,y2,x+t,y2,'cota')+T(x+fs/100*1.2,(y1+y2)/2,label,'middle','',true);};
  const open=`<svg class="drw" viewBox="0 0 ${f1(vbW)} ${f1(vbH)}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  return {X,Y,D,R,Ln,C,T,cotaH,cotaV,open,vbW,vbH,fs};
}
const m = n => n.toFixed(2)+' m';

/* ---------- Vista lateral ---------- */
function sideSVG(v, placed, o={}){
  const g=G(v), cot=o.cotas!==false;
  const xMin = g.isC ? -0.35 : -(g.cabL+0.4);
  const xMax = g.Lm + (cot?0.75:0.35);
  const yMax = Math.max(g.topH,g.cabH) + (cot?0.4:0.12);
  const yMin = cot ? -0.6 : -0.06;
  const F = frame(xMin,xMax,yMin,yMax,o.tw||780,o.th||470, cot?{b:-0.32,r:g.Lm+0.32}:{});
  const {R,Ln,C,T,X,Y,D}=F;
  let s=F.open;
  s+=Ln(xMin,0,xMax,0,'gnd');

  if (g.isC){
    s+=R(0,0,g.Lm,g.Hm,'stl-t');
    for(let x=0.3;x<g.Lm-0.1;x+=0.3) s+=Ln(x,0.1,x,g.Hm-0.1,'rib');
    s+=R(0,g.Hm-0.1,g.Lm,0.1,'stl')+R(0,0,g.Lm,0.1,'stl');
    for(const cx of [0,g.Lm-0.18]) for(const cy of [0,g.Hm-0.12]) s+=R(cx,cy,0.18,0.12,'stl');
    s+=Ln(g.Lm-0.05,0.1,g.Lm-0.05,g.Hm-0.1,'ln');
    for(const hy of [0.35,g.Hm*0.5,g.Hm-0.35]) s+=R(g.Lm-0.09,hy-0.05,0.08,0.1,'stl');
  } else {
    const {deckH,cabL,cabH,wr,Lm}=g;
    const xf=-(cabL+0.05), xr=-0.05, yb=wr*1.05;
    // chasis
    if (g.cfg==='semi') s+=R(xf+0.1,wr*0.9,cabL+0.9,0.24,'stl');
    else s+=R(xf+0.1,deckH-0.28,cabL+0.2,0.16,'stl');
    // cabina
    const yWin=yb+(cabH-yb)*0.5;
    s+=`<path class="cab" d="M${X(xf)} ${Y(yb)} L${X(xf)} ${Y(yWin)} L${X(xf+cabL*0.16)} ${Y(cabH)} L${X(xr)} ${Y(cabH)} L${X(xr)} ${Y(yb)} Z"/>`;
    s+=`<path class="glass" d="M${X(xf+0.06)} ${Y(yWin+0.04)} L${X(xf+cabL*0.17)} ${Y(cabH-0.1)} L${X(xf+cabL*0.62)} ${Y(cabH-0.1)} L${X(xf+cabL*0.62)} ${Y(yWin+0.04)} Z"/>`;
    s+=Ln(xf+cabL*0.66,yb+0.12,xf+cabL*0.66,cabH-0.08,'ln');
    s+=R(xf-0.04,yb,0.1,0.22,'stl');
    // viga del piso y plataforma
    s+=R(0,deckH-0.25,Lm,0.18,'stl');
    s+=R(0,deckH-0.07,Lm,0.07,'stl');
    for(let x=0.6;x<Lm-0.2;x+=Math.max(1.4,Lm/9)) s+=R(x,deckH-0.17,0.07,0.05,'lamp');
    s+=R(Lm-0.06,deckH-0.2,0.06,0.07,'lampr');
    if (g.cfg==='semi'){
      const legH=Math.max(deckH-0.42,0.2);
      for(const lx of [Lm*0.1,Lm*0.16]) s+=R(lx,deckH-0.25-legH+0.18,0.07,legH-0.18,'stl');
      s+=R(Lm*0.1-0.06,0,0.24,0.05,'stl');
      s+=R(Lm*0.45-wr*0.8,deckH-0.32-0.2,wr*1.6,0.2,'tire');
      s+=R(Lm*0.78-wr-0.15,2*wr+0.04,Lm*0.17+2*wr+0.3,0.05,'stl');
    }
    // ruedas
    for(const ax of g.axles){ s+=C(ax,wr,wr,'tire')+C(ax,wr,wr*0.45,'hub'); }
    // cabecera
    s+=R(0,deckH,0.07,g.hbH,'stl');
  }
  // carga
  for(const b of placed) s+='<g><title>'+esc(b.label||'')+'</title>'+itemSide(b,g,F)+'</g>';
  if (!g.isC){
    if (g.cfg==='rigid'){
      s+=R(0,g.deckH,g.Lm,g.barH,'stl-t');
      for(let x=0.25;x<g.Lm;x+=0.25) s+=Ln(x,g.deckH+0.04,x,g.deckH+g.barH-0.04,'rib');
    }
    s+=R(0,g.deckH,g.Lm,g.Hm,'env');
  }
  if (cot){
    const base=g.isC?0:g.deckH;
    s+=F.cotaH(0,g.Lm,-0.32,m(g.Lm));
    s+=F.cotaV(g.Lm+0.32,base,base+g.Hm,m(g.Hm)+(g.isC?'':' estiba'));
    s+=T(g.isC?0.05:-(g.cabL+0.05),Math.max(g.topH,g.cabH)+0.12,'frente','start','lbl');
    s+=T(g.Lm,Math.max(g.topH,g.cabH)+0.12,'cola','end','lbl');
  }
  return s+'</svg>';
}
function itemSide(b,g,F){
  const {R,C}=F, x=b.x/100, z=g.deckH+b.z/100, dx=b.dx/100, dz=b.dz/100, st=darker(b.color);
  if (b.shape==='taco') return R(x,z,dx,dz,'wood');
  if (b.shape==='bundle'){
    const t=Math.min(0.1,dz*0.25), w=Math.min(0.1,dx*0.08); let s='';
    for(const f of [0.12,0.5,0.88]) s+=R(x+dx*f-w/2,z,w,t,'wood');
    return s+R(x,z+t,dx,dz-t,'',`rx="${F.D(0.03)}" fill="${b.color}" fill-opacity=".85" stroke="${st}"`)+F.Ln(x+0.04,z+t+(dz-t)/2,x+dx-0.04,z+t+(dz-t)/2,'',`stroke="${st}" stroke-opacity=".45"`);
  }
  if (b.shape==='roll'){
    if (b.dy>=b.dx) return C(x+dx/2,z+dz/2,dz/2,'',`fill="${b.color}" fill-opacity=".9" stroke="${st}"`)+C(x+dx/2,z+dz/2,dz*0.14,'',`fill="none" stroke="${st}"`);
    return R(x,z,dx,dz,'',`rx="${F.D(dz/2)}" fill="${b.color}" fill-opacity=".9" stroke="${st}"`);
  }
  if (b.shape==='pallet'){
    const ph=Math.min(0.14,dz*0.18); let s='';
    s+=R(x,z+ph-0.04,dx,0.04,'wood');
    for(const f of [0,0.45,0.9]) s+=R(x+dx*f,z,dx*0.1,ph-0.04,'woodd');
    return s+R(x,z+ph,dx,dz-ph,'',`fill="${b.color}" fill-opacity=".85" stroke="${st}"`);
  }
  return R(x,z,dx,dz,'',`fill="${b.color}" fill-opacity=".85" stroke="${st}"`);
}

/* ---------- Vista trasera (desde la cola) ---------- */
function frontSVG(v, placed){
  const g=G(v), hw=g.Wm/2;
  const yTop=Math.max(g.topH,g.cabH);
  const F=frame(-hw-0.45,hw+0.6,-0.5,yTop+0.4,780,470,{b:-0.32,r:hw+0.38});
  const {R,Ln,C,T}=F;
  let s=F.open+Ln(-hw-0.45,0,hw+0.75,0,'gnd');
  if (g.isC){
    s+=R(-hw,0,g.Wm,g.Hm,'stl-t');
    s+=R(-hw,g.Hm-0.1,g.Wm,0.1,'stl')+R(-hw,0,g.Wm,0.1,'stl');
    for(const cx of [-hw,hw-0.18]) for(const cy of [0,g.Hm-0.12]) s+=R(cx,cy,0.18,0.12,'stl');
  } else {
    const {deckH,wr,cabH}=g;
    s+=`<rect x="${F.X(-g.Wm*0.45)}" y="${F.Y(cabH)}" width="${F.D(g.Wm*0.9)}" height="${F.D(cabH-wr*1.05)}" rx="${F.D(0.12)}" class="ghost"/>`;
    s+=R(-g.Wm*0.49,deckH,g.Wm*0.98,g.hbH,'ghost');
    for(const sx of [-1,1]){
      const cx=sx*(hw-0.12);
      s+=`<rect x="${F.X(cx-0.29)}" y="${F.Y(2*wr)}" width="${F.D(0.27)}" height="${F.D(2*wr)}" rx="${F.D(0.05)}" class="tire"/>`;
      s+=`<rect x="${F.X(cx+0.02)}" y="${F.Y(2*wr)}" width="${F.D(0.27)}" height="${F.D(2*wr)}" rx="${F.D(0.05)}" class="tire"/>`;
    }
    for(const sx of [-1,1]) s+=R(sx*0.45-0.06,deckH-0.25-0.35,0.12,0.53,'stl');
    s+=R(-hw,deckH-0.25,g.Wm,0.18,'stl')+R(-hw,deckH-0.07,g.Wm,0.07,'stl');
    s+=R(-g.Wm*0.42,0.38,g.Wm*0.84,0.12,'stl');
    for(const sx of [-1,1]) for(const k of [0,1,2]) s+=C(sx*(g.Wm*0.4-k*0.16),0.44,0.045,k===0?'lampr':'lamp');
    for(const sx of [-1,1]) s+=R(sx*(hw-0.12)-0.3,0.12,0.6,0.02,'rib');
  }
  const sorted=[...placed].sort((a,b)=>a.x-b.x);
  for(const b of sorted){
    s+='<g><title>'+esc(b.label||'')+'</title>';
    const u=-hw+b.y/100, z=g.deckH+b.z/100, dy=b.dy/100, dz=b.dz/100, st=darker(b.color);
    if (b.shape==='taco'){ s+=R(u,z,dy,dz,'wood'); }
    else if (b.shape==='bundle'){
      const t=Math.min(0.1,dz*0.25), bh=dz-t;
      s+=R(u,z,dy,t,'wood');
      s+=`<rect x="${F.X(u)}" y="${F.Y(z+dz)}" width="${F.D(dy)}" height="${F.D(bh)}" rx="${F.D(Math.min(bh,dy)*0.3)}" fill="${b.color}" fill-opacity=".85" stroke="${st}"/>`;
      const r=0.035, nx=Math.max(1,Math.floor(dy/(2*r+0.02))), ny=Math.max(1,Math.floor(bh/(2*r+0.02)));
      if (nx*ny<=400) for(let i=0;i<nx;i++) for(let j=0;j<ny;j++) s+=C(u+(i+0.5)*dy/nx,z+t+(j+0.5)*bh/ny,r,'',`fill="none" stroke="${st}" stroke-opacity=".55"`);
    }
    else if (b.shape==='roll'){
      if (b.dy>=b.dx){
        s+=`<rect x="${F.X(u)}" y="${F.Y(z+dz)}" width="${F.D(dy)}" height="${F.D(dz)}" rx="${F.D(0.04)}" fill="${b.color}" fill-opacity=".9" stroke="${st}"/>`;
        s+=Ln(u+0.03,z+dz/2,u+dy-0.03,z+dz/2,'',`stroke="${st}" stroke-dasharray="6 5"`);
      } else s+=C(u+dy/2,z+dz/2,dz/2,'',`fill="${b.color}" fill-opacity=".9" stroke="${st}"`);
    } else if (b.shape==='pallet'){
      const ph=Math.min(0.14,dz*0.18);
      s+=R(u,z+ph-0.04,dy,0.04,'wood');
      for(const f of [0,0.45,0.9]) s+=R(u+dy*f,z,dy*0.1,ph-0.04,'woodd');
      s+=R(u,z+ph,dy,dz-ph,'',`fill="${b.color}" fill-opacity=".85" stroke="${st}"`);
    } else s+=R(u,z,dy,dz,'',`fill="${b.color}" fill-opacity=".85" stroke="${st}"`);
    s+='</g>';
  }
  if (g.isC){
    for(const k of [-0.36,-0.14,0.14,0.36]) s+=Ln(k*g.Wm,0.12,k*g.Wm,g.Hm-0.12,'ln','stroke-opacity=".55"');
    s+=Ln(0,0.1,0,g.Hm-0.1,'ln');
  } else {
    if (g.cfg==='rigid'){
      s+=R(-hw,g.deckH,g.Wm,g.barH,'stl-t');
      for(let x=-hw+0.2;x<hw;x+=0.2) s+=Ln(x,g.deckH+0.04,x,g.deckH+g.barH-0.04,'rib');
    }
    s+=R(-hw,g.deckH,g.Wm,g.Hm,'env');
  }
  const base=g.isC?0:g.deckH;
  s+=F.cotaH(-hw,hw,-0.32,m(g.Wm));
  s+=F.cotaV(hw+0.38,base,base+g.Hm,m(g.Hm));
  return s+'</svg>';
}

/* ---------- Vista superior ---------- */
function topSVG(v, placed){
  const g=G(v);
  const xMin=g.isC?-0.35:-(g.cabL+0.4);
  // vertical: v=0 lado izquierdo arriba
  const F=frame(xMin,g.Lm+0.6,-0.5,g.Wm+0.3,780,470,{b:-0.32,r:g.Lm+0.38});
  const {Ln,T}=F;
  // en planta usamos y como "altura" del frame: y = Wm - v
  const RR=(x,v0,w,h,cls,extra='')=>F.R(x,g.Wm-v0-h,w,h,cls,extra);
  const LL=(x1,v1,x2,v2,cls,extra='')=>Ln(x1,g.Wm-v1,x2,g.Wm-v2,cls,extra);
  let s=F.open;
  if (g.isC){
    s+=RR(0,0,g.Lm,g.Wm,'stl-t');
    for(const vv of [0.05,g.Wm-0.05]) s+=LL(0,vv,g.Lm,vv,'rib');
  } else {
    for(const ax of g.axles) for(const vv of [0.02,g.Wm-0.3]) s+=RR(ax-g.wr,vv,2*g.wr,0.28,'ghost');
    s+=`<rect x="${F.X(-(g.cabL+0.05))}" y="${F.Y(g.Wm-g.Wm*0.05)}" width="${F.D(g.cabL)}" height="${F.D(g.Wm*0.9)}" rx="${F.D(0.15)}" class="cab"/>`;
    s+=RR(-(g.cabL+0.05)+g.cabL*0.1,g.Wm*0.12,g.cabL*0.2,g.Wm*0.76,'glass');
    s+=RR(0,0,g.Lm,g.Wm,'stl');
    for(let x=0.5;x<g.Lm;x+=0.5) s+=LL(x,0.02,x,g.Wm-0.02,'rib');
    s+=RR(0,0.01,0.07,g.Wm*0.98,'stl');
  }
  const sorted=[...placed].sort((a,b)=>a.z-b.z);
  for(const b of sorted){
    s+='<g><title>'+esc(b.label||'')+'</title>';
    const x=b.x/100, vv=b.y/100, dx=b.dx/100, dy=b.dy/100, st=darker(b.color);
    if (b.shape==='taco'){ s+=RR(x,vv,dx,dy,'wood'); }
    else if (b.shape==='roll'){
      s+=RR(x,vv,dx,dy,'',`rx="${F.D(0.03)}" fill="${b.color}" fill-opacity=".9" stroke="${st}"`);
      if (b.dy>=b.dx){ s+=LL(x+dx/2,vv+0.03,x+dx/2,vv+dy-0.03,'',`stroke="${st}" stroke-dasharray="6 5"`); s+=LL(x+0.03,vv+0.06,x+dx-0.03,vv+0.06,'',`stroke="${st}"`)+LL(x+0.03,vv+dy-0.06,x+dx-0.03,vv+dy-0.06,'',`stroke="${st}"`); }
    } else if (b.shape==='pallet'){
      s+=RR(x,vv,dx,dy,'',`fill="${b.color}" fill-opacity=".85" stroke="${st}"`);
      s+=LL(x+0.06,vv+0.06,x+dx-0.06,vv+dy-0.06,'',`stroke="${st}" stroke-opacity=".5"`)+LL(x+0.06,vv+dy-0.06,x+dx-0.06,vv+0.06,'',`stroke="${st}" stroke-opacity=".5"`);
    } else s+=RR(x,vv,dx,dy,'',`fill="${b.color}" fill-opacity=".85" stroke="${st}"`);
    s+='</g>';
  }
  if (!g.isC && g.cfg==='rigid') for(const vv of [0.02,g.Wm-0.02]) s+=LL(0,vv,g.Lm,vv,'ln','stroke-width="3"');
  if (!g.isC && g.cfg==='rigid') s+=LL(g.Lm-0.02,0,g.Lm-0.02,g.Wm,'ln','stroke-width="3"');
  s+=F.cotaH(0,g.Lm,-0.32,m(g.Lm));
  s+=F.cotaV(g.Lm+0.38,0,g.Wm,m(g.Wm));
  return s+'</svg>';
}

/* ---------- 3D (adaptado de view3d.js) ---------- */
let THREE=null, OrbitControls=null, renderer=null, scene=null, camera=null, controls=null, rafId=0, resizeObs=null;
async function ensure3D(){
  if (THREE) return true;
  try{
    THREE = await import('three');
    ({OrbitControls} = await import('three/addons/controls/OrbitControls.js'));
    return true;
  }catch(e){ THREE=null; return false; }
}
function dispose3D(){
  if (rafId) cancelAnimationFrame(rafId); rafId=0;
  if (resizeObs){resizeObs.disconnect();resizeObs=null}
  if (controls){controls.dispose();controls=null}
  if (scene){scene.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())});scene=null}
  if (renderer){renderer.dispose();renderer=null}
}
function cssColor(name){ return new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(name).trim()); }
function show3D(container, v, placed){
  dispose3D(); container.innerHTML='';
  const g=G(v), {Lm,Wm,Hm,isC,deckH,topH,cfg,cabL,cabH,wr}=g;
  const width=container.clientWidth-16||700, height=Math.round(Math.min(470,Math.max(320,width*0.62)));
  try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }
  catch(e){ container.innerHTML='<div class="msg">Este navegador no pudo iniciar la vista 3D (WebGL no disponible).<br>Usa las vistas Lateral, Trasera o Superior.</div>'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(width,height);
  container.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(42,width/height,0.05,200);
  const maxDim=Math.max(Lm,topH,Wm);
  camera.position.set(Lm*0.42, topH+maxDim*0.42, Wm+maxDim*0.55);
  controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,topH*0.45,0); controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxDistance=maxDim*6; controls.update();

  const lineC=cssColor('--line'), steelC=cssColor('--steel'), tireC=cssColor('--tire');
  scene.add(new THREE.AmbientLight(0xffffff,1.05));
  const dir=new THREE.DirectionalLight(0xffffff,1.4); dir.position.set(Lm,topH*2.5,Wm*1.5); scene.add(dir);
  const dir2=new THREE.DirectionalLight(0xffe3b3,0.35); dir2.position.set(-Lm,topH,-Wm); scene.add(dir2);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(Lm*2.2,Wm*3.2),new THREE.MeshLambertMaterial({color:cssColor('--panel-2')}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.002; scene.add(ground);
  const grid=new THREE.GridHelper(Math.max(Lm*2.2,Wm*3.2),24,cssColor('--border-strong'),cssColor('--border')); scene.add(grid);
  const addEdges=(mesh,col=lineC)=>{const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),new THREE.LineBasicMaterial({color:col}));e.position.copy(mesh.position);e.rotation.copy(mesh.rotation);scene.add(e);};

  if (isC){
    const boxGeo=new THREE.BoxGeometry(Lm,Hm,Wm);
    const fr=new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo),new THREE.LineBasicMaterial({color:lineC}));
    fr.position.set(0,Hm/2,0); scene.add(fr);
    const floor=new THREE.Mesh(new THREE.BoxGeometry(Lm,0.02,Wm),new THREE.MeshLambertMaterial({color:steelC,transparent:true,opacity:0.85}));
    floor.position.y=0.01; scene.add(floor);
    const wall=new THREE.Mesh(new THREE.BoxGeometry(Lm,Hm,0.02),new THREE.MeshLambertMaterial({color:steelC,transparent:true,opacity:0.25}));
    wall.position.set(0,Hm/2,-Wm/2); scene.add(wall);
  } else {
    const deck=new THREE.Mesh(new THREE.BoxGeometry(Lm,0.07,Wm),new THREE.MeshLambertMaterial({color:steelC}));
    deck.position.y=deckH-0.035; scene.add(deck); addEdges(deck);
    const beam=new THREE.Mesh(new THREE.BoxGeometry(Lm,0.18,Wm*0.96),new THREE.MeshLambertMaterial({color:steelC}));
    beam.position.y=deckH-0.16; scene.add(beam);
    const hx=Lm/2,hz=Wm/2,pts=[];
    for(const [sx,sz] of [[-hx,-hz],[hx,-hz],[hx,hz],[-hx,hz]]) pts.push(sx,deckH,sz,sx,topH,sz);
    pts.push(-hx,topH,-hz,hx,topH,-hz, hx,topH,-hz,hx,topH,hz, hx,topH,hz,-hx,topH,hz, -hx,topH,hz,-hx,topH,-hz);
    const envGeo=new THREE.BufferGeometry(); envGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    const env=new THREE.LineSegments(envGeo,new THREE.LineDashedMaterial({color:cssColor('--sage'),dashSize:0.16,gapSize:0.11}));
    env.computeLineDistances(); scene.add(env);
    const hb=new THREE.Mesh(new THREE.BoxGeometry(0.05,g.hbH,Wm*0.98),new THREE.MeshLambertMaterial({color:steelC,transparent:true,opacity:0.6}));
    hb.position.set(-Lm/2+0.03,deckH+g.hbH/2,0); scene.add(hb); addEdges(hb);
    if (cfg==='rigid'){
      const barMat=new THREE.MeshLambertMaterial({color:steelC,transparent:true,opacity:0.35});
      const mk=(sx,sy,sz,px,py,pz)=>{const mm=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),barMat);mm.position.set(px,py,pz);scene.add(mm);addEdges(mm);};
      mk(Lm,g.barH,0.03,0,deckH+g.barH/2,Wm/2-0.02);
      mk(Lm,g.barH,0.03,0,deckH+g.barH/2,-Wm/2+0.02);
      mk(0.03,g.barH,Wm,Lm/2-0.02,deckH+g.barH/2,0);
    }
    const cabMesh=new THREE.Mesh(new THREE.BoxGeometry(cabL,cabH-wr*1.05,Wm*0.9),new THREE.MeshLambertMaterial({color:cssColor('--cab')}));
    cabMesh.position.set(-(Lm/2+cabL/2+0.05),wr*1.05+(cabH-wr*1.05)/2,0); scene.add(cabMesh); addEdges(cabMesh);
    const glass=new THREE.Mesh(new THREE.BoxGeometry(0.02,(cabH-wr*1.05)*0.38,Wm*0.78),new THREE.MeshLambertMaterial({color:cssColor('--glass')}));
    glass.position.set(-(Lm/2+cabL+0.06),cabH-(cabH-wr*1.05)*0.26,0); scene.add(glass);
    const wheelGeo=new THREE.CylinderGeometry(wr,wr,0.26,20), wheelMat=new THREE.MeshLambertMaterial({color:tireC});
    for(const ax of g.axles) for(const sz of [-1,1]){
      const wh=new THREE.Mesh(wheelGeo,wheelMat); wh.rotation.x=Math.PI/2; wh.position.set(-Lm/2+ax,wr,sz*(Wm/2-0.12)); scene.add(wh);
    }
    if (cfg==='semi'){
      const spare=new THREE.Mesh(new THREE.CylinderGeometry(wr*0.8,wr*0.8,0.2,16),wheelMat);
      spare.position.set(-Lm/2+Lm*0.45,deckH-0.25-0.1,0); scene.add(spare);
      const legH=Math.max(deckH-0.42,0.2), legGeo=new THREE.BoxGeometry(0.06,legH,0.06);
      for(const lx of [-Lm/2+Lm*0.1,-Lm/2+Lm*0.16]) for(const sz of [-0.35,0.35]){
        const leg=new THREE.Mesh(legGeo,wheelMat); leg.position.set(lx,deckH-0.07-legH/2,sz*Wm); scene.add(leg);
      }
    }
  }
  const dk=hex=>new THREE.Color(hex).multiplyScalar(0.55);
  for(const b of placed){
    const dx=b.dx/100,dy=b.dy/100,dz=b.dz/100;
    const cx=-Lm/2+(b.x+b.dx/2)/100, cz=-Wm/2+(b.y+b.dy/2)/100, y0=deckH+b.z/100;
    if (b.shape==='taco'){
      const tk=new THREE.Mesh(new THREE.BoxGeometry(dx,dz,dy),new THREE.MeshLambertMaterial({color:0xa1622d}));
      tk.position.set(cx,y0+dz/2,cz); scene.add(tk); continue;
    }
    if (b.shape==='bundle'){
      const t=Math.min(0.1,dz*0.25), wood=new THREE.MeshLambertMaterial({color:0xa1622d});
      for(const f of [0.12,0.5,0.88]){const tk=new THREE.Mesh(new THREE.BoxGeometry(Math.min(0.1,dx*0.08),t,dy),wood);tk.position.set(-Lm/2+(b.x+b.dx*f)/100,y0+t/2,cz);scene.add(tk);}
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(dx,dz-t,dy),new THREE.MeshLambertMaterial({color:new THREE.Color(b.color),transparent:true,opacity:0.9}));
      mesh.position.set(cx,y0+t+(dz-t)/2,cz); scene.add(mesh); addEdges(mesh,dk(b.color));
      continue;
    }
    if (b.shape==='roll'){
      const axisX=b.dx>=b.dy, len=axisX?dx:dy, rad=Math.max(dz/2,0.01);
      const geo=new THREE.CylinderGeometry(rad,rad,len,28,1,false);
      const mesh=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:new THREE.Color(b.color),transparent:true,opacity:0.92}));
      if (axisX) mesh.rotation.z=Math.PI/2; else mesh.rotation.x=Math.PI/2;
      mesh.position.set(cx,y0+dz/2,cz); scene.add(mesh);
      const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,24),new THREE.LineBasicMaterial({color:dk(b.color)}));
      e.rotation.copy(mesh.rotation); e.position.copy(mesh.position); scene.add(e);
      continue;
    }
    if (b.shape==='pallet'){
      const ph=Math.min(0.14,dz*0.18), cargoH=Math.max(dz-ph,0.01);
      const wood=new THREE.MeshLambertMaterial({color:0xa1622d}), woodD=new THREE.MeshLambertMaterial({color:0x7a4a1d});
      for(const f of [0.18,0.5,0.82]){const st=new THREE.Mesh(new THREE.BoxGeometry(dx,0.09,dy*0.12),woodD);st.position.set(cx,y0+0.045,-Wm/2+(b.y+b.dy*f)/100);scene.add(st);}
      const pd=new THREE.Mesh(new THREE.BoxGeometry(dx,0.04,dy),wood); pd.position.set(cx,y0+0.11,cz); scene.add(pd);
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(dx,cargoH,dy),new THREE.MeshLambertMaterial({color:new THREE.Color(b.color),transparent:true,opacity:0.88}));
      mesh.position.set(cx,y0+ph+cargoH/2,cz); scene.add(mesh); addEdges(mesh,dk(b.color));
      continue;
    }
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(dx,dz,dy),new THREE.MeshLambertMaterial({color:new THREE.Color(b.color),transparent:true,opacity:0.88}));
    mesh.position.set(cx,y0+dz/2,cz); scene.add(mesh); addEdges(mesh,dk(b.color));
  }
  resizeObs=new ResizeObserver(()=>{const w=container.clientWidth-16;if(!w||!renderer)return;const h=Math.round(Math.min(470,Math.max(320,w*0.62)));renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();});
  resizeObs.observe(container);
  const loop=()=>{rafId=requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);};
  loop();
}

const COLORS = ['#2f7d5b','#c9821a','#3b6ea8','#a33b3b','#7a5ba6','#4f8f8f','#b0632f','#6b7f2a','#8a4f7d','#2f5f7d'];
const TIPO = {PALLET:'Pallet',PQT:'Paquete',CAJA:'Caja',ROLLO:'Rollo',BOLSA:'Bolsa',BULTO:'Bulto'};

/* ---------- Acomodo (criterios tomados de las fotos de despacho) ----------
   · Bultos largos (≥ 1.5 m): siempre a lo largo de la unidad, sobre tacos.
   · Pallets y paquetes: máximo de niveles por línea (por defecto 2).
   · Rollos: de costado (anidados o en columnas) o a lo largo (pirámide desde la cola o capas con tacos). */
const TACO = 10;
const ROLL_MODES = {
  'costado': 'De costado, capas anidadas',
  'columnas': 'De costado, en columnas',
  'largo-piramide': 'A lo largo, pirámide (vista desde la cola)',
  'largo-tacos': 'A lo largo, capas sobre tacos',
};
const tiersOf = ln => ln.tiers ?? (ln.stack === false ? 1 : 2);
function pack(v, lines) {
  const placed = [], unfit = {}; let kg = 0;
  const L = v.L, W = v.W, H = v.H, maxKg = v.kg;
  const miss = (ln, why, n = 1) => { const k = ln.id; unfit[k] = unfit[k] || { ln, esp: 0, peso: 0 }; unfit[k][why] += n; };
  const tryKg = (ln) => { const w = +ln.kg || 0; if (maxKg && kg + w > maxKg + 1e-6) return false; kg += w; return true; };
  const lab = (ln) => `${ln.d}${ln.c ? ' · ' + ln.c : ''} · ${ln.sh === 'roll' ? `rollo ${ln.L} cm, Ø ${ln.W} cm` : `${ln.L}×${ln.W}×${ln.H} cm`}${ln.kg ? ' · ' + ln.kg + ' kg' : ''}`;
  const taco = (x, y, z, dx, dy) => placed.push({ shape: 'taco', x, y, z, dx, dy, dz: TACO, color: '#a1622d', label: 'Taco de madera' });
  let xEnd = 0;
  const S3 = Math.sqrt(3) / 2;

  // 1) rollos, desde la cabecera
  for (const ln of lines.filter(l => l.sh === 'roll')) {
    const len = ln.L, d = Math.max(ln.W, ln.H);
    let q = ln.qty;
    let mode = ln.mode || (len <= W ? 'costado' : 'largo-piramide');
    if ((mode === 'costado' || mode === 'columnas') && len > W) mode = 'largo-piramide';
    const x0 = xEnd, room = L - x0;
    const put = (p) => { if (!tryKg(ln)) { miss(ln, 'peso'); return false; } placed.push({ shape: 'roll', color: ln.color, label: lab(ln), lid: ln.id, ...p }); return true; };
    if (d > H) { miss(ln, 'esp', q); continue; }
    let maxX = x0;

    if (mode === 'costado' || mode === 'columnas') {
      const lanes = Math.max(1, Math.floor(W / len));
      const y0 = (W - lanes * len) / 2;
      const nested = mode === 'costado';
      const K = nested ? Math.floor((H - d) / (d * S3)) + 1 : Math.floor(H / d);
      const bMax = Math.floor(room / d);
      if (bMax < 1 || K < 1) { miss(ln, 'esp', q); continue; }
      const cap = b => { let c = 0; for (let k = 0; k < K; k++) c += nested ? Math.max(b - k, 0) : b; return c * lanes; };
      let b = 1; while (b < bMax && cap(b) < q) b++;
      // en la cabecera las capas pares se apoyan contra ella (frente vertical, escalones hacia la cola)
      const lean = x0 === 0;
      outer: for (let k = 0; k < K; k++) {
        const n = nested ? b - k : b;
        const off = !nested ? 0 : lean ? (k % 2) * d / 2 : k * d / 2;
        for (let i = 0; i < n; i++) for (let la = 0; la < lanes; la++) {
          if (q <= 0) break outer;
          q--;
          const x = x0 + off + i * d;
          if (x + d > L) { miss(ln, 'esp'); continue; }
          if (put({ x, y: y0 + la * len, z: nested ? k * d * S3 : k * d, dx: d, dy: len, dz: d })) maxX = Math.max(maxX, x + d);
        }
      }
    } else {
      // a lo largo: filas de rollos de largo "len" una detrás de otra
      const withTacos = mode === 'largo-tacos';
      const base = Math.floor(W / d);
      const rows = Math.floor(room / len);
      if (base < 1 || rows < 1) { miss(ln, 'esp', q); continue; }
      const K = withTacos ? Math.floor(H / (d + TACO)) : Math.min(base, Math.floor((H - d) / (d * S3)) + 1);
      const yOff = (W - base * d) / 2;
      outer2: for (let r = 0; r < rows; r++) {
        const x = x0 + r * len;
        for (let k = 0; k < K; k++) {
          const n = withTacos ? base : base - k;
          if (q <= 0) break outer2;
          if (withTacos) for (const f of [0.15, 0.85]) taco(x + len * f - 5, yOff, k * (d + TACO), 10, base * d);
          for (let j = 0; j < n; j++) {
            if (q <= 0) break outer2;
            q--;
            const z = withTacos ? k * (d + TACO) + TACO : k * d * S3;
            const y = withTacos ? yOff + j * d : yOff + k * d / 2 + j * d;
            if (put({ x, y, z, dx: len, dy: d, dz: d })) maxX = Math.max(maxX, x + len);
          }
        }
      }
    }
    if (q > 0) miss(ln, 'esp', q);
    xEnd = Math.ceil(maxX) + (maxX > x0 ? 5 : 0);
  }

  // 2) resto: puntos extremos; piso completo primero, luego niveles superiores
  const boxes = [];
  const others = lines.filter(l => l.sh !== 'roll').slice().sort((a, b) => (b.L * b.W) - (a.L * a.W) || b.H - a.H);
  let pts = [{ x: xEnd, y: 0, z: 0 }];
  const ovl = (a, b) => a.x < b.x + b.dx && b.x < a.x + a.dx && a.y < b.y + b.dy && b.y < a.y + a.dy && a.z < b.z + b.dz && b.z < a.z + a.dz;
  const support = (c) => {
    if (c.z === 0) return 1;
    let area = 0, tier = 0;
    for (const b of boxes) {
      if (Math.abs(b.z + b.dz - c.z) > 0.5) continue;
      const ox = Math.min(c.x + c.dx, b.x + b.dx) - Math.max(c.x, b.x);
      const oy = Math.min(c.y + c.dy, b.y + b.dy) - Math.max(c.y, b.y);
      if (ox <= 0 || oy <= 0) continue;
      if (b.tier >= b.maxT) return 0;           // la de abajo no admite más niveles
      area += ox * oy; tier = Math.max(tier, b.tier);
    }
    return area >= 0.75 * c.dx * c.dy ? tier + 1 : 0;
  };
  for (const ln of others) {
    const maxT = tiersOf(ln);
    const hh = ln.H + (ln.sh === 'bundle' ? TACO : 0);
    const long = Math.max(ln.L, ln.W) >= 150;
    const ors = ln.L === ln.W ? [[ln.L, ln.W]] : long ? [[Math.max(ln.L, ln.W), Math.min(ln.L, ln.W)]] : [[ln.L, ln.W], [ln.W, ln.L]];
    for (let n = 0; n < ln.qty; n++) {
      pts.sort((a, b) => a.z - b.z || a.x - b.x || a.y - b.y);
      let best = null;
      for (const p of pts) {
        for (const [dx, dy] of ors) {
          const c = { x: p.x, y: p.y, z: p.z, dx, dy, dz: hh };
          if (c.x + dx > L || c.y + dy > W || c.z + c.dz > H) continue;
          if (boxes.some(b => ovl(b, c))) continue;
          if (placed.some(b => (b.shape === 'roll' || b.shape === 'taco') && ovl(b, c))) continue;
          const t = support(c);
          if (!t || t > maxT) continue;
          c.tier = t;
          if (!best || c.x + c.dx < best.x + best.dx) best = c;
        }
        if (best) break;
      }
      if (!best) { miss(ln, 'esp'); continue; }
      if (!tryKg(ln)) { miss(ln, 'peso'); continue; }
      best.maxT = maxT;
      boxes.push(best);
      placed.push({ shape: ln.sh, x: best.x, y: best.y, z: best.z, dx: best.dx, dy: best.dy, dz: best.dz, color: ln.color, label: lab(ln), lid: ln.id });
      pts = pts.filter(p => !(p.x === best.x && p.y === best.y && p.z === best.z));
      for (const np of [{ x: best.x + best.dx, y: best.y, z: best.z }, { x: best.x, y: best.y + best.dy, z: best.z }, { x: best.x, y: best.y, z: best.z + best.dz }])
        if (np.x < L && np.y < W && np.z < H && !pts.some(p => p.x === np.x && p.y === np.y && p.z === np.z)) pts.push(np);
    }
  }
  const cargo = placed.filter(b => b.shape !== 'taco');
  const vol = cargo.reduce((s, b) => s + (b.shape === 'roll' ? Math.PI / 4 * b.dz * b.dz * Math.max(b.dx, b.dy) : b.dx * b.dy * b.dz), 0);
  const lin = placed.reduce((m, b) => Math.max(m, b.x + b.dx), 0);
  return { placed, count: cargo.length, unfit: Object.values(unfit), kg, vol, lin };
}

const shapeFor = (sh, L, W) => sh === 'box' && Math.max(L, W) >= 150 ? 'bundle' : sh;
function updTierNote() {
  const L = +$('eL').value, W = +$('eW').value;
  $('tierNote').textContent = Math.max(L, W) >= 150 ? 'Bulto largo: va a lo largo, sobre tacos.' : '';
}
function effUnit() { const h = state.hOver[state.unit.id]; return h ? { ...state.unit, H: h } : state.unit; }
/* ---------- Catálogo ---------- */
const $ = id => document.getElementById(id);
const fams = [...new Set(CAT.map(e => e.f))].sort((a, b) => a === 'Otros' ? 1 : b === 'Otros' ? -1 : a.localeCompare(b, 'es'));
$('fam').innerHTML = '<option value="">Todas las familias</option>' + fams.map(f => `<option>${esc(f)}</option>`).join('');
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
CAT.forEach(e => e._s = norm(e.d + ' ' + e.c + ' ' + e.f));
function renderResults() {
  const terms = norm($('q').value.trim()).split(/\s+/).filter(Boolean);
  const f = $('fam').value;
  const hits = CAT.filter(e => (!f || e.f === f) && terms.every(t => e._s.includes(t)));
  $('resMeta').textContent = `${hits.length} de ${CAT.length} materiales` + (hits.length > 40 ? ' · mostrando 40, afina la búsqueda' : '');
  $('results').innerHTML = hits.slice(0, 40).map(e => `<button class="res" type="button" data-c="${e.c}" aria-pressed="${state.sel && state.sel.c === e.c}">${esc(e.d)}<small>${e.c} · ${TIPO[e.t] || e.t} ${e.sh === 'roll' ? `${e.L} cm, Ø ${e.W} cm` : `${e.L}×${e.W}×${e.H} cm`} · ${e.kg ? e.kg + ' kg' : 'sin peso'}${e.n ? ' · ' + e.n + ' despachos' : ''}</small></button>`).join('') || '<div class="empty">Sin resultados. Prueba con otra palabra o con el código SAP.</div>';
}
function pick(e) {
  state.sel = e;
  $('edName').textContent = e.d;
  const est = e.est || '';
  const parts = [`${e.c} · ${e.f} · ${TIPO[e.t] || e.t}`];
  if (e.u) parts.push(`${e.u.toLocaleString('es-PE')} ${e.um || 'und'} por bulto`);
  if (e.ku) parts.push(`${e.ku} kg/${e.um || 'und'}`);
  parts.push(e.s === 'm' ? 'del maestro de materiales' : `${e.n} despacho${e.n === 1 ? '' : 's'} registrado${e.n === 1 ? '' : 's'}`);
  const notes = [];
  if (est.includes('Ø')) notes.push('diámetro estimado por el largo de malla');
  if (est.includes('L')) notes.push('largo y ancho típicos del tipo de bulto');
  if (est.includes('H') && e.sh !== 'roll') notes.push('alto asumido');
  if (!e.kg) notes.push('sin peso registrado, ingrésalo');
  $('edInfo').innerHTML = esc(parts.join(' · ')) + (notes.length ? `<br><span class="est">Revisa: ${esc(notes.join(', '))}.</span>` : '');
  setRollMode(e.sh === 'roll');
  $('eL').value = e.L; $('eW').value = e.W; $('eH').value = e.H; $('eKg').value = e.kg ?? '';
  $('eTier').value = '2';
  $('eMode').value = e.L > state.unit.W ? 'largo-piramide' : 'costado';
  const rs = MAT.filter(m => m.f === e.f && e.f !== 'Otros');
  const FL = { P: 'paletizado', T: 'sobre tacos', Z: 'enzunchado', F: 'stretch film', R: 'rotulado' };
  $('rules').innerHTML = rs.length ? `<details class="rules"><summary>Embalaje por cliente en la matriz (${rs.length})</summary>${rs.map(m => `<div class="rule"><b>${esc(m.cl)}</b> · ${esc(m.p)}<br>${[...m.fl].map(k => FL[k]).join(', ') || 'sin indicaciones'}${m.zu ? ' (' + esc(m.zu) + ')' : ''}${m.co ? ' · color ' + esc(m.co) : ''}${m.ob ? '<br>' + esc(m.ob) : ''}</div>`).join('')}</details>` : '';
  renderResults();
}
function setRollMode(r) {
  $('eWl').textContent = r ? 'Diámetro (cm)' : 'Ancho (cm)';
  $('eH').closest('.field').style.display = r ? 'none' : '';
  $('tierWrap').style.display = r ? 'none' : '';
  $('modeWrap').style.display = r ? '' : 'none';
  updTierNote();
  $('eL').previousElementSibling.textContent = r ? 'Largo rollo (cm)' : 'Largo (cm)';
}
$('results').addEventListener('click', ev => { const b = ev.target.closest('[data-c]'); if (b) pick(CAT.find(e => e.c === +b.dataset.c)); });
$('q').addEventListener('input', renderResults);
$('eMode').innerHTML = Object.entries(ROLL_MODES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
['eL', 'eW'].forEach(id => $(id).addEventListener('input', updTierNote));
$('fam').addEventListener('change', renderResults);

function addLine(src, qty) {
  const used = new Set(state.lines.map(l => l.color));
  const color = COLORS.find(c => !used.has(c)) || COLORS[state.lines.length % COLORS.length];
  state.lines.push({ id: Date.now() + Math.random(), color, qty, ...src });
}
$('btnAdd').addEventListener('click', () => {
  const e = state.sel || {};
  const roll = e.sh === 'roll';
  const Lv = Math.round(+$('eL').value), Wv = Math.round(+$('eW').value), Hv = roll ? Wv : Math.round(+$('eH').value);
  const q = Math.min(500, Math.max(1, Math.round(+$('eQ').value || 1)));
  for (const el of ['eL', 'eW', 'eH']) $(el).style.borderColor = '';
  const bad = [['eL', Lv], ['eW', Wv], ...(roll ? [] : [['eH', Hv]])].filter(([, v]) => !(v > 0));
  if (bad.length) { bad.forEach(([id]) => $(id).style.borderColor = '#b91c1c'); return; }
  const sh = roll ? 'roll' : shapeFor(e.sh || 'box', Lv, Wv);
  addLine({ c: e.c || null, d: e.d || 'Bulto manual', t: e.t || 'BULTO', sh, L: Lv, W: Wv, H: Hv, kg: +$('eKg').value || 0, tiers: roll ? 1 : +$('eTier').value, mode: roll ? $('eMode').value : undefined }, q);
  save(); renderAll();
});
$('btnClear').addEventListener('click', () => { state.lines = []; save(); renderAll(); });
$('btnDemo').addEventListener('click', () => {
  state.lines = [];
  for (const [code, q] of [[1200379, 20], [1118600, 8], [1011168, 4]]) {
    const e = CAT.find(x => x.c === code); if (!e) continue;
    addLine({ c: e.c, d: e.d, t: e.t, sh: e.sh === 'roll' ? 'roll' : shapeFor(e.sh, e.L, e.W), L: e.L, W: e.W, H: e.H, kg: e.kg || 0, tiers: 2, mode: e.sh === 'roll' ? 'costado' : undefined }, q);
  }
  save(); renderAll();
});
$('lines').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-act]'); if (!b) return;
  const ln = state.lines.find(l => String(l.id) === b.dataset.id); if (!ln) return;
  if (b.dataset.act === 'del') state.lines = state.lines.filter(l => l !== ln);
  if (b.dataset.act === 'inc') ln.qty = Math.min(500, ln.qty + 1);
  if (b.dataset.act === 'dec') ln.qty = Math.max(1, ln.qty - 1);
  save(); renderAll();
});

/* ---------- Render ---------- */
let RES = { placed: [], unfit: [], kg: 0, vol: 0, lin: 0 };
function renderList() {
  let html = '', grp = '';
  for (const u of UNITS) {
    if (u.grp !== grp) { if (grp) html += '</div>'; grp = u.grp; html += `<p class="group">${grp}</p><div class="units">`; }
    html += `<button class="unit" type="button" data-id="${u.id}" aria-pressed="${u === state.unit}">${nameOf(u)}<small>${(u.L / 100).toFixed(2)} × ${(u.W / 100).toFixed(2)} × ${(u.H / 100).toFixed(2)} m · ${(u.kg / 1000).toFixed(1)} t</small></button>`;
  }
  $('unitList').innerHTML = html + '</div>';
}
function renderSpec() {
  const u = effUnit(), vol = u.L * u.W * u.H / 1e6;
  const tipo = u.kind === 'container' ? 'cerrado' : (u.cfg === 'semi' ? 'plataforma abierta' : 'plataforma c/ barandas');
  const over = !!state.hOver[u.id];
  $('spec').innerHTML = `<div class="title">${nameOf(u)}<span>${u.cls}</span></div>
    <div class="kv">Largo útil<b>${(u.L / 100).toFixed(2)} m</b></div>
    <div class="kv">Ancho útil<b>${(u.W / 100).toFixed(2)} m</b></div>
    <div class="kv"><label for="hEdit">${u.kind === 'container' ? 'Alto interior' : 'Alto de estiba'} (m)</label><input id="hEdit" class="hedit" type="number" step="0.05" min="0.5" max="${u.kind === 'container' ? (state.unit.H / 100).toFixed(2) : '3.5'}" value="${(u.H / 100).toFixed(2)}" ${u.kind === 'container' ? 'disabled' : ''}>${over ? `<button type="button" class="reset" id="hReset">registro: ${(state.unit.H / 100).toFixed(2)}</button>` : ''}</div>
    <div class="kv">Volumen útil<b>${vol.toFixed(1)} m³</b></div>
    <div class="kv">Carga máx.<b>${u.kg.toLocaleString('es-PE')} kg</b></div>
    <div class="kv">Tipo<b>${tipo}</b></div>`;
  const inp = $('hEdit');
  inp.addEventListener('change', () => {
    const v = Math.round(+inp.value * 100);

let jsPDFLoad = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPDFLoad) jsPDFLoad = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = './jspdf.umd.min.js';
    s.onload = () => window.jspdf ? res(window.jspdf.jsPDF) : rej(new Error('jspdf'));
    s.onerror = () => { jsPDFLoad = null; rej(new Error('jspdf')); };
    document.head.appendChild(s);
  });

}
// texto seguro para las fuentes estándar del PDF
const P = s => String(s ?? '').replace(/[′’‘]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/≥/g, '>=').replace(/…/g, '...').replace(/[^\x00-\xFF]/g, '?');

function drwCss() {
  const cs = getComputedStyle(document.documentElement);
  let css = '';
  for (const sh of document.styleSheets) {
    let rules; try { rules = sh.cssRules; } catch (e) { continue; }
    for (const r of rules) if (r.selectorText && r.selectorText.startsWith('.drw')) css += r.cssText + '\n';
  }
  return css.replace(/var\((--[\w-]+)\)/g, (m, n) => cs.getPropertyValue(n).trim() || '#000')
            .replace(/font-family:[^;}]+/g, 'font-family:"Courier New",monospace');
}
async function svgToImg(svg, pxW) {
  const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const vw = +vb[1], vh = +vb[2], pxH = Math.round(pxW * vh / vw);
  svg = svg.replace(/^<svg /, `<svg width="${pxW}" height="${pxH}" `).replace(/(<svg[^>]*>)/, `$1<style>${drwCss()}</style>`);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const cv = document.createElement('canvas'); cv.width = pxW; cv.height = pxH;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fbf8f0'; ctx.fillRect(0, 0, pxW, pxH); ctx.drawImage(img, 0, 0, pxW, pxH);
  return { data: cv.toDataURL('image/jpeg', 0.9), ratio: vh / vw };
}

  for (const ls of [doc.splitTextToSize(P(rep.rObs || 'Ninguna.'), CW)]) { ensure(ls.length * 4 + 2); doc.text(ls, M, y); y += ls.length * 4 + 3; }
  doc.setFontSize(7.5); doc.setTextColor(...GREY);
  const crit = doc.splitTextToSize(P('Criterios de acomodo: rollos desde la cabecera según el acomodo elegido; bultos largos a lo largo de la unidad sobre tacos; pallets y paquetes hasta el número de niveles indicado, llenando primero el piso. Medidas y pesos tomados del catálogo de materiales Prodimin; los altos de bulto y diámetros de rollo marcados como estimados deben verificarse. Este informe es una estimación teórica: validar contra las reglas de estiba, el amarre y el peso por eje antes del despacho.'), CW);
  ensure(crit.length * 3.4 + 4); doc.text(crit, M, y); y += crit.length * 3.4 + 4;

  // firmas
  ensure(16); y += 8;
  doc.setDrawColor(...GREY); doc.setLineWidth(0.3);
  for (const [i, t] of ['Elaborado por', 'Revisado por', 'Transportista'].entries()) {
    const w = (CW - 16) / 3, x = M + i * (w + 8);
    doc.line(x, y, x + w, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY);
    doc.text(P(t), x + w / 2, y + 4, { align: 'center' });
    if (i === 0 && rep.rResp) { doc.setTextColor(...INK); doc.text(P(rep.rResp), x + w / 2, y - 2, { align: 'center' }); }
  }

  // pie de página
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.3); doc.line(M, 287, PW - M, 287);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(...GREY);
    doc.text(P(`Prodimin · Soluciones Mineras — Informe de cubicaje ${folio}`), M, 291);
    doc.text(`Página ${i} de ${n}`, PW - M, 291, { align: 'right' });
  }
  const safe = s => P(s).replace(/[^\w.-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
  return { doc, filename: `Informe_cubicaje_${safe(nameOf(u))}_${folio}.pdf` };
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

$('btnPdf').addEventListener('click', async () => {
  const btn = $('btnPdf'), st = $('pdfStatus');
  if (!state.lines.length) { st.textContent = 'Agrega al menos un material a la carga para generar el informe.'; return; }
  btn.disabled = true; btn.textContent = 'Generando informe…'; st.textContent = '';
  try {
    const { doc, filename } = await buildPdf();
    const blob = doc.output('blob');
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename, data: blob }); st.textContent = 'Informe guardado: ' + filename; }
      catch (e) { st.textContent = e && e.code === 'declined' ? 'Descarga cancelada.' : e && e.code === 'rate_limited' ? 'Ya hay una descarga pendiente; inténtalo en unos segundos.' : 'No se pudo guardar el PDF en esta vista.'; }
    } else {
      doc.save(filename); st.textContent = 'Informe generado: ' + filename;
    }
  } catch (e) {
    st.textContent = 'No se pudo generar el PDF. Verifica que jspdf.umd.min.js esté junto a index.html.';
  } finally { btn.disabled = false; btn.textContent = 'Descargar informe PDF'; }
});
</script>
